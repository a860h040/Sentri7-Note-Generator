<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#f4f6f8;--card:#fff;--line:#d9dee5;--text:#17202a;
      --muted:#68727d;--accent:#2f5f9f;--danger:#b42318
    }
    *{box-sizing:border-box}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:Arial,Helvetica,sans-serif;font-size:13px
    }
    .appShell{min-height:100vh}
    .sidebar{
      position:fixed;left:0;top:0;bottom:0;width:210px;
      background:#fff;border-right:1px solid var(--line);
      padding:14px 10px;z-index:100
    }
    .brand{
      padding:4px 8px 14px;border-bottom:1px solid #edf0f3;margin-bottom:10px
    }
    .brandTitle{font-size:16px;font-weight:700;color:#1f2d3d}
    .brandSub{font-size:10.5px;color:var(--muted);margin-top:3px}
    .sideNav{display:flex;flex-direction:column;gap:5px}
    .tab{
      width:100%;height:36px;border:1px solid transparent;background:transparent;
      color:#39424e;border-radius:7px;padding:0 10px;font-weight:700;
      cursor:pointer;text-align:left
    }
    .tab:hover{background:#f3f6f9}
    .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .main{margin-left:210px;min-height:100vh;padding:12px 10px}
    .wrap{width:min(980px,100%);margin:0 auto}
    .panel{display:none}
    .panel.active{display:block}
    .card{
      background:var(--card);border:1px solid var(--line);
      border-radius:9px;padding:10px;margin-bottom:9px
    }
    .top{
      display:grid;grid-template-columns:minmax(280px,1.4fr) minmax(190px,.6fr);
      gap:8px;align-items:end
    }
    label{
      display:block;font-size:10.5px;font-weight:700;color:#4c5662;
      margin:0 0 3px 1px
    }
    input,select,textarea,button{font:inherit}
    input[type="text"],select{
      width:100%;height:32px;border:1px solid #cfd5dc;border-radius:6px;
      background:#fff;padding:5px 8px;outline:none
    }
    textarea{
      width:100%;border:1px solid #cfd5dc;border-radius:7px;
      padding:9px;line-height:1.42;outline:none;resize:vertical;background:#fff
    }
    input:focus,select:focus,textarea:focus{
      border-color:#7da3d3;box-shadow:0 0 0 2px rgba(47,95,159,.1)
    }
    .control{position:relative}
    .suggestions{
      position:absolute;left:0;right:0;top:52px;background:#fff;
      border:1px solid #cfd5dc;border-radius:7px;
      box-shadow:0 8px 24px rgba(16,24,40,.12);
      max-height:320px;overflow:auto;z-index:50;display:none
    }
    .suggestion{padding:7px 9px;border-bottom:1px solid #edf0f3;cursor:pointer}
    .suggestion:hover{background:#f0f5fb}
    .st{font-weight:700;font-size:12px}
    .ss{font-size:10.5px;color:var(--muted);margin-top:2px}
    .selected{margin-top:6px;font-size:11px;color:#44505c;min-height:14px}
    .selected strong{color:#1f2d3d}
    #fieldsCard,#resultCard,#grammarResultCard{display:none}
    .fields{
      display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
      gap:6px 7px
    }
    .field{min-width:0}
    .field label{
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help
    }
    .field input{height:30px;font-size:12px;padding:4px 7px}
    .actions{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
    button{
      height:31px;border-radius:6px;border:1px solid transparent;padding:0 12px;
      cursor:pointer;font-weight:700;font-size:12px
    }
    .primary{background:var(--accent);color:#fff}
    .secondary{background:#fff;border-color:#cfd5dc;color:#39424e}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{font-size:11px;color:var(--muted);min-height:14px}
    .status.error{color:var(--danger)}
    #comment{min-height:110px}
    #grammarInput{min-height:150px}
    #grammarOutput{min-height:150px}
    .resultTop{display:flex;justify-content:flex-end;margin-bottom:5px}
    .empty{font-size:11px;color:var(--muted)}
    .grammarHint{font-size:11px;color:var(--muted);margin-top:5px}
    @media(max-width:720px){
      .sidebar{
        position:static;width:100%;min-height:auto;border-right:0;
        border-bottom:1px solid var(--line);padding:8px 10px
      }
      .brand{padding:2px 4px 8px;margin-bottom:7px}
      .sideNav{flex-direction:row}
      .tab{width:auto;flex:1;text-align:center}
      .main{margin-left:0;padding:10px}
      .top{grid-template-columns:1fr}
      .fields{grid-template-columns:1fr 1fr}
    }
    @media(max-width:430px){
      .fields{grid-template-columns:1fr}
      .sideNav{flex-direction:column}
      .tab{width:100%;text-align:left}
    }
  </style>
</head>
<body>
<div class="appShell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandTitle">Sentri7 Tools</div>
      <div class="brandSub">Pharmacist documentation assistant</div>
    </div>
    <nav class="sideNav">
      <button id="noteTab" class="tab active" type="button">Sentri7 Note</button>
      <button id="grammarTab" class="tab" type="button">Grammar Correction</button>
    </nav>
  </aside>

  <main class="main">
    <div class="wrap">

  <div id="notePanel" class="panel active">
    <div class="card">
      <div class="top">
        <div class="control">
          <label for="ruleSearch">Medication or Sentri7 note</label>
          <input id="ruleSearch" type="text" autocomplete="off"
                 placeholder="e.g., heparin, cefepime, vancomycin, IV to PO">
          <div id="suggestions" class="suggestions"></div>
        </div>

        <div>
          <label for="noteType">Type</label>
          <select id="noteType" disabled>
            <option value="">Select note first</option>
          </select>
        </div>
      </div>
      <div id="selectedRule" class="selected"></div>
    </div>

    <div id="fieldsCard" class="card">
      <div id="fields" class="fields"></div>
      <div id="emptyFields" class="empty" style="display:none"></div>

      <div class="actions">
        <button id="generateBtn" class="primary" disabled>Generate Comment</button>
        <button id="clearBtn" class="secondary" type="button">Clear</button>
        <span id="status" class="status"></span>
      </div>
    </div>

    <div id="resultCard" class="card">
      <div class="resultTop">
        <button id="copyBtn" class="secondary" type="button">Copy</button>
      </div>
      <textarea id="comment" spellcheck="true"></textarea>
    </div>
  </div>

  <div id="grammarPanel" class="panel">
    <div class="card">
      <label for="grammarInput">Sentence or paragraph</label>
      <textarea id="grammarInput" spellcheck="true"
                placeholder="Type or paste the sentence or paragraph you want Gemini to correct."></textarea>
      <div class="grammarHint">
        Gemini will correct grammar, spelling, punctuation, capitalization, spacing, and readability while preserving the original meaning.
      </div>

      <div class="actions">
        <button id="grammarCorrectBtn" class="primary" type="button">Correct Grammar</button>
        <button id="grammarClearBtn" class="secondary" type="button">Clear</button>
        <span id="grammarStatus" class="status"></span>
      </div>
    </div>

    <div id="grammarResultCard" class="card">
      <div class="resultTop">
        <button id="grammarCopyBtn" class="secondary" type="button">Copy</button>
      </div>
      <textarea id="grammarOutput" spellcheck="true"></textarea>
    </div>
  </div>

    </div>
  </main>
</div>

<script>
  let catalog = [];
  let selectedRuleId = '';

  const noteTab = document.getElementById('noteTab');
  const grammarTab = document.getElementById('grammarTab');
  const notePanel = document.getElementById('notePanel');
  const grammarPanel = document.getElementById('grammarPanel');

  const ruleSearch = document.getElementById('ruleSearch');
  const suggestions = document.getElementById('suggestions');
  const noteType = document.getElementById('noteType');
  const selectedRule = document.getElementById('selectedRule');
  const fieldsCard = document.getElementById('fieldsCard');
  const fields = document.getElementById('fields');
  const emptyFields = document.getElementById('emptyFields');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const comment = document.getElementById('comment');
  const copyBtn = document.getElementById('copyBtn');

  const grammarInput = document.getElementById('grammarInput');
  const grammarCorrectBtn = document.getElementById('grammarCorrectBtn');
  const grammarClearBtn = document.getElementById('grammarClearBtn');
  const grammarStatus = document.getElementById('grammarStatus');
  const grammarResultCard = document.getElementById('grammarResultCard');
  const grammarOutput = document.getElementById('grammarOutput');
  const grammarCopyBtn = document.getElementById('grammarCopyBtn');

  function switchTab(which) {
    const grammar = which === 'grammar';

    noteTab.classList.toggle('active', !grammar);
    grammarTab.classList.toggle('active', grammar);
    notePanel.classList.toggle('active', !grammar);
    grammarPanel.classList.toggle('active', grammar);

    if (grammar) {
      setTimeout(function() { grammarInput.focus(); }, 50);
    } else {
      setTimeout(function() { ruleSearch.focus(); }, 50);
    }
  }

  function init() {
    setStatus('Loading rules...');
    google.script.run
      .withSuccessHandler(function(data) {
        catalog = Array.isArray(data) ? data : [];
        setStatus('');
      })
      .withFailureHandler(showError)
      .getRuleCatalog();
  }

  function normalize(s) {
    return String(s || '').toLowerCase().trim();
  }

  function scoreRule(rule, query) {
    const q = normalize(query);
    if (!q) return -1;

    const title = normalize(rule.title);
    const section = normalize(rule.section);
    const all = normalize(rule.searchText);
    const tokens = q.split(/\s+/).filter(Boolean);

    let score = 0;
    if (title === q) score += 300;
    if (title.startsWith(q)) score += 170;
    if (title.includes(q)) score += 120;
    if (section.includes(q)) score += 35;
    if (all.includes(q)) score += 50;

    tokens.forEach(function(t) {
      if (title.includes(t)) score += 35;
      if (all.includes(t)) score += 9;
    });

    return score;
  }

  function showSuggestions() {
    const q = ruleSearch.value.trim();

    const matches = catalog
      .map(function(r) { return {rule:r, score:scoreRule(r,q)}; })
      .filter(function(x) { return x.score > 0; })
      .sort(function(a,b) {
        return b.score - a.score || a.rule.title.localeCompare(b.rule.title);
      })
      .slice(0,14)
      .map(function(x) { return x.rule; });

    suggestions.innerHTML = '';

    if (!q || !matches.length) {
      suggestions.style.display = 'none';
      return;
    }

    matches.forEach(function(rule) {
      const div = document.createElement('div');
      div.className = 'suggestion';
      div.innerHTML =
        '<div class="st">' + escapeHtml(rule.title) + '</div>' +
        '<div class="ss">' + escapeHtml(rule.section) + '</div>';

      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        chooseRule(rule.id);
      });

      suggestions.appendChild(div);
    });

    suggestions.style.display = 'block';
  }

  function chooseRule(ruleId) {
    const rule = catalog.find(function(r) { return r.id === ruleId; });
    if (!rule) return;

    selectedRuleId = ruleId;
    ruleSearch.value = rule.title;
    suggestions.style.display = 'none';

    selectedRule.innerHTML =
      '<strong>' + escapeHtml(rule.title) + '</strong> · ' +
      escapeHtml(rule.section);

    noteType.innerHTML = '';

    (rule.types || []).forEach(function(type) {
      const option = document.createElement('option');
      option.value = type;
      option.textContent = type;
      noteType.appendChild(option);
    });

    noteType.disabled = !(rule.types && rule.types.length);

    loadForm(
      ruleId,
      rule.types && rule.types.length ? rule.types[0] : ''
    );
  }

  function loadForm(ruleId, type) {
    setStatus('Loading required fields...');
    generateBtn.disabled = true;

    google.script.run
      .withSuccessHandler(function(form) {
        renderForm(form);
        setStatus('');
      })
      .withFailureHandler(showError)
      .getRuleForm(ruleId, type);
  }

  function renderForm(form) {
    fields.innerHTML = '';
    emptyFields.style.display = 'none';
    fieldsCard.style.display = 'block';
    resultCard.style.display = 'none';
    comment.value = '';

    noteType.innerHTML = '';

    (form.availableTypes || []).forEach(function(type) {
      const option = document.createElement('option');
      option.value = type;
      option.textContent = type;
      option.selected = type === form.selectedType;
      noteType.appendChild(option);
    });

    noteType.disabled = !(form.availableTypes || []).length;

    const list = form.fields || [];

    if (!list.length) {
      emptyFields.textContent =
        'No required data fields are listed for this pathway.';
      emptyFields.style.display = 'block';
    } else {
      list.forEach(function(field, index) {
        const wrap = document.createElement('div');
        wrap.className = 'field';

        const label = document.createElement('label');
        label.htmlFor = 'field_' + index;
        label.textContent = field.label;
        label.title = field.label;

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'field_' + index;
        input.dataset.label = field.label;
        input.placeholder = '[]';
        input.autocomplete = 'off';

        wrap.appendChild(label);
        wrap.appendChild(input);
        fields.appendChild(wrap);
      });
    }

    generateBtn.disabled = false;
  }

  function collectFields() {
    return Array.from(
      fields.querySelectorAll('input[data-label]')
    ).map(function(input) {
      return {
        label: input.dataset.label,
        value: input.value.trim()
      };
    });
  }

  function generate() {
    if (!selectedRuleId || !noteType.value) return;

    generateBtn.disabled = true;
    setStatus('Generating...');
    resultCard.style.display = 'none';

    const payload = {
      ruleId: selectedRuleId,
      noteType: noteType.value,
      fields: collectFields()
    };

    google.script.run
      .withSuccessHandler(function(result) {
        comment.value = result && result.comment
          ? result.comment
          : '';

        resultCard.style.display = 'block';
        setStatus('');
        generateBtn.disabled = false;
      })
      .withFailureHandler(function(err) {
        showError(err);
        generateBtn.disabled = false;
      })
      .generateSentri7Comment(payload);
  }

  function correctGrammar() {
    const text = grammarInput.value.trim();

    if (!text) {
      setGrammarStatus('Enter a sentence or paragraph first.', true);
      grammarInput.focus();
      return;
    }

    grammarCorrectBtn.disabled = true;
    grammarResultCard.style.display = 'none';
    setGrammarStatus('Correcting...');

    google.script.run
      .withSuccessHandler(function(result) {
        grammarOutput.value =
          result && result.corrected ? result.corrected : '';

        grammarResultCard.style.display = 'block';
        setGrammarStatus('');
        grammarCorrectBtn.disabled = false;
      })
      .withFailureHandler(function(err) {
        setGrammarStatus(
          err && err.message ? err.message : String(err),
          true
        );
        grammarCorrectBtn.disabled = false;
      })
      .correctGrammar(text);
  }

  function clearAll() {
    ruleSearch.value = '';
    selectedRuleId = '';
    selectedRule.innerHTML = '';
    noteType.innerHTML =
      '<option value="">Select note first</option>';
    noteType.disabled = true;
    fieldsCard.style.display = 'none';
    resultCard.style.display = 'none';
    comment.value = '';
    setStatus('');
    ruleSearch.focus();
  }

  function clearGrammar() {
    grammarInput.value = '';
    grammarOutput.value = '';
    grammarResultCard.style.display = 'none';
    setGrammarStatus('');
    grammarInput.focus();
  }

  function setStatus(message, isError) {
    statusEl.textContent = message || '';
    statusEl.className =
      'status' + (isError ? ' error' : '');
  }

  function setGrammarStatus(message, isError) {
    grammarStatus.textContent = message || '';
    grammarStatus.className =
      'status' + (isError ? ' error' : '');
  }

  function showError(err) {
    setStatus(
      err && err.message ? err.message : String(err),
      true
    );
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function(c) {
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[c];
    });
  }

  noteTab.addEventListener('click', function() {
    switchTab('note');
  });

  grammarTab.addEventListener('click', function() {
    switchTab('grammar');
  });

  ruleSearch.addEventListener('input', function() {
    if (selectedRuleId) {
      const selected = catalog.find(function(r) {
        return r.id === selectedRuleId;
      });

      if (!selected || ruleSearch.value.trim() !== selected.title) {
        selectedRuleId = '';
        selectedRule.innerHTML = '';
        noteType.innerHTML =
          '<option value="">Select note first</option>';
        noteType.disabled = true;
        fieldsCard.style.display = 'none';
        resultCard.style.display = 'none';
      }
    }
    showSuggestions();
  });

  ruleSearch.addEventListener('focus', showSuggestions);

  ruleSearch.addEventListener('blur', function() {
    setTimeout(function() {
      suggestions.style.display = 'none';
    }, 120);
  });

  noteType.addEventListener('change', function() {
    if (selectedRuleId) {
      loadForm(selectedRuleId, noteType.value);
    }
  });

  generateBtn.addEventListener('click', generate);
  clearBtn.addEventListener('click', clearAll);
  grammarCorrectBtn.addEventListener('click', correctGrammar);
  grammarClearBtn.addEventListener('click', clearGrammar);

  copyBtn.addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(comment.value);
      copyBtn.textContent = 'Copied';
      setTimeout(function() {
        copyBtn.textContent = 'Copy';
      }, 900);
    } catch (e) {
      comment.select();
      document.execCommand('copy');
    }
  });

  grammarCopyBtn.addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(grammarOutput.value);
      grammarCopyBtn.textContent = 'Copied';
      setTimeout(function() {
        grammarCopyBtn.textContent = 'Copy';
      }, 900);
    } catch (e) {
      grammarOutput.select();
      document.execCommand('copy');
    }
  });

  init();
</script>
</body>
</html>
