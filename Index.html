<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --line:#d9dee5;
      --line2:#e9edf1;
      --text:#17202a;
      --muted:#68727d;
      --accent:#2f5f9f;
      --accent2:#244d82;
      --danger:#b42318;
      --shadow:0 1px 3px rgba(16,24,40,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
      font-size:13px;
    }
    .wrap{
      width:min(980px,calc(100% - 20px));
      margin:12px auto;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:9px;
      box-shadow:var(--shadow);
      padding:10px;
      margin-bottom:9px;
    }
    .top-grid{
      display:grid;
      grid-template-columns:minmax(260px,1.5fr) minmax(180px,.7fr);
      gap:8px;
      align-items:end;
    }
    .control{position:relative}
    label{
      display:block;
      font-size:10.5px;
      font-weight:700;
      color:#4c5662;
      margin:0 0 3px 1px;
      line-height:1.2;
    }
    input,select,textarea,button{
      font:inherit;
    }
    input[type="text"],select{
      width:100%;
      height:32px;
      border:1px solid #cfd5dc;
      border-radius:6px;
      background:#fff;
      padding:5px 8px;
      color:var(--text);
      outline:none;
    }
    input[type="text"]:focus,select:focus,textarea:focus{
      border-color:#7da3d3;
      box-shadow:0 0 0 2px rgba(47,95,159,.10);
    }
    .suggestions{
      position:absolute;
      left:0;right:0;top:53px;
      background:#fff;
      border:1px solid #cfd5dc;
      border-radius:7px;
      box-shadow:0 8px 24px rgba(16,24,40,.12);
      max-height:320px;
      overflow:auto;
      z-index:50;
      display:none;
    }
    .suggestion{
      padding:7px 9px;
      border-bottom:1px solid var(--line2);
      cursor:pointer;
      line-height:1.25;
    }
    .suggestion:last-child{border-bottom:0}
    .suggestion:hover,.suggestion.active{background:#f0f5fb}
    .s-title{font-weight:700;font-size:12px}
    .s-section{font-size:10.5px;color:var(--muted);margin-top:2px}
    .selected{
      margin-top:6px;
      font-size:11px;
      color:#44505c;
      min-height:14px;
    }
    .selected strong{color:#1f2d3d}
    #fieldsCard{display:none}
    .fields{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
      gap:6px 7px;
    }
    .field{
      min-width:0;
    }
    .field label{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      cursor:help;
    }
    .field input{
      height:30px;
      padding:4px 7px;
      font-size:12px;
    }
    .action-row{
      display:flex;
      gap:7px;
      align-items:center;
      margin-top:8px;
      flex-wrap:wrap;
    }
    button{
      height:31px;
      border-radius:6px;
      border:1px solid transparent;
      padding:0 12px;
      cursor:pointer;
      font-weight:700;
      font-size:12px;
    }
    .primary{background:var(--accent);color:white}
    .primary:hover{background:var(--accent2)}
    .secondary{background:#fff;border-color:#cfd5dc;color:#39424e}
    .secondary:hover{background:#f8fafc}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{
      font-size:11px;
      color:var(--muted);
      min-height:14px;
      margin-left:2px;
    }
    .status.error{color:var(--danger)}
    #resultCard{display:none}
    .result-top{
      display:flex;
      justify-content:flex-end;
      gap:6px;
      margin-bottom:5px;
    }
    #comment{
      width:100%;
      min-height:112px;
      resize:vertical;
      border:1px solid #cfd5dc;
      border-radius:7px;
      padding:9px;
      font-size:13px;
      line-height:1.42;
      color:#17202a;
      background:#fff;
      outline:none;
    }
    .empty-note{
      font-size:11px;
      color:var(--muted);
      padding:2px 0 0 1px;
    }
    @media(max-width:650px){
      .top-grid{grid-template-columns:1fr}
      .suggestions{top:53px}
      .fields{grid-template-columns:1fr 1fr}
    }
    @media(max-width:430px){
      .fields{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="top-grid">
      <div class="control">
        <label for="ruleSearch">Medication or Sentri7 note</label>
        <input id="ruleSearch" type="text" autocomplete="off"
               placeholder="e.g., cefepime, heparin, vancomycin, IV to PO">
        <div id="suggestions" class="suggestions"></div>
      </div>

      <div class="control">
        <label for="noteType">Type</label>
        <select id="noteType" disabled>
          <option value="">Select note first</option>
        </select>
      </div>
    </div>
    <div id="selectedRule" class="selected"></div>
  </div>

  <div id="fieldsCard" class="card">
    <div id="fields" class="fields"></div>
    <div id="noFields" class="empty-note" style="display:none"></div>
    <div class="action-row">
      <button id="generateBtn" class="primary" disabled>Generate Comment</button>
      <button id="clearBtn" class="secondary" type="button">Clear</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div id="resultCard" class="card">
    <div class="result-top">
      <button id="copyBtn" class="secondary" type="button">Copy</button>
    </div>
    <textarea id="comment" spellcheck="true"></textarea>
  </div>

</div>

<script>
  let catalog = [];
  let selectedRuleId = '';
  let activeIndex = -1;
  let currentForm = null;

  const ruleSearch = document.getElementById('ruleSearch');
  const suggestions = document.getElementById('suggestions');
  const noteType = document.getElementById('noteType');
  const selectedRule = document.getElementById('selectedRule');
  const fieldsCard = document.getElementById('fieldsCard');
  const fields = document.getElementById('fields');
  const noFields = document.getElementById('noFields');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const status = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const comment = document.getElementById('comment');
  const copyBtn = document.getElementById('copyBtn');

  function init() {
    setStatus('Loading Sentri7 rules...');
    google.script.run
      .withSuccessHandler(function(data) {
        catalog = Array.isArray(data) ? data : [];
        setStatus('');
      })
      .withFailureHandler(showError)
      .getRuleCatalog();
  }

  function normalize(s) {
    return String(s || '').toLowerCase().trim();
  }

  function scoreRule(rule, query) {
    const q = normalize(query);
    if (!q) return -1;

    const title = normalize(rule.title);
    const section = normalize(rule.section);
    const all = normalize(rule.searchText);
    const tokens = q.split(/\s+/).filter(Boolean);

    let score = 0;
    if (title === q) score += 300;
    if (title.startsWith(q)) score += 170;
    if (title.includes(q)) score += 120;
    if (section.includes(q)) score += 35;
    if (all.includes(q)) score += 50;

    tokens.forEach(function(t) {
      if (title.includes(t)) score += 35;
      if (all.includes(t)) score += 9;
    });

    return score;
  }

  function findMatches(query) {
    return catalog
      .map(function(r) { return { rule:r, score:scoreRule(r, query) }; })
      .filter(function(x) { return x.score > 0; })
      .sort(function(a,b) {
        if (b.score !== a.score) return b.score - a.score;
        return a.rule.title.localeCompare(b.rule.title);
      })
      .slice(0, 14)
      .map(function(x) { return x.rule; });
  }

  function showSuggestions() {
    const q = ruleSearch.value.trim();
    const matches = findMatches(q);
    suggestions.innerHTML = '';
    activeIndex = -1;

    if (!q || !matches.length) {
      suggestions.style.display = 'none';
      return;
    }

    matches.forEach(function(rule, i) {
      const div = document.createElement('div');
      div.className = 'suggestion';
      div.dataset.ruleId = rule.id;
      div.innerHTML =
        '<div class="s-title">' + escapeHtml(rule.title) + '</div>' +
        '<div class="s-section">' + escapeHtml(rule.section) + '</div>';

      div.addEventListener('mousedown', function(e) {
        e.preventDefault();
        chooseRule(rule.id);
      });
      suggestions.appendChild(div);
    });

    suggestions.style.display = 'block';
  }

  function chooseRule(ruleId) {
    const rule = catalog.find(function(r) { return r.id === ruleId; });
    if (!rule) return;

    selectedRuleId = ruleId;
    ruleSearch.value = rule.title;
    suggestions.style.display = 'none';
    selectedRule.innerHTML =
      '<strong>' + escapeHtml(rule.title) + '</strong> · ' + escapeHtml(rule.section);

    noteType.innerHTML = '';
    (rule.types || []).forEach(function(type) {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      noteType.appendChild(opt);
    });

    noteType.disabled = !(rule.types && rule.types.length);
    loadForm(ruleId, rule.types && rule.types.length ? rule.types[0] : '');
  }

  function loadForm(ruleId, type) {
    setStatus('Loading fields...');
    generateBtn.disabled = true;

    google.script.run
      .withSuccessHandler(function(form) {
        currentForm = form;
        renderForm(form);
        setStatus('');
      })
      .withFailureHandler(showError)
      .getRuleForm(ruleId, type);
  }

  function renderForm(form) {
    fields.innerHTML = '';
    noFields.style.display = 'none';
    fieldsCard.style.display = 'block';
    resultCard.style.display = 'none';
    comment.value = '';

    noteType.innerHTML = '';
    (form.availableTypes || []).forEach(function(type) {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type;
      if (type === form.selectedType) opt.selected = true;
      noteType.appendChild(opt);
    });
    noteType.disabled = !(form.availableTypes && form.availableTypes.length);

    if (form.noTemplate || !(form.availableTypes || []).length) {
      noFields.textContent = 'No documentation template is defined in the Excel guideline for this rule.';
      noFields.style.display = 'block';
      generateBtn.disabled = true;
      return;
    }

    const list = form.fields || [];
    if (!list.length) {
      noFields.textContent = 'No required fields are listed in the Excel guideline for this pathway.';
      noFields.style.display = 'block';
    } else {
      list.forEach(function(f, i) {
        const wrap = document.createElement('div');
        wrap.className = 'field';

        const label = document.createElement('label');
        label.htmlFor = 'field_' + i;
        label.textContent = f.label;
        label.title = f.label;

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'field_' + i;
        input.dataset.label = f.label;
        input.placeholder = '[]';
        input.autocomplete = 'off';

        wrap.appendChild(label);
        wrap.appendChild(input);
        fields.appendChild(wrap);
      });
    }

    generateBtn.disabled = false;
  }

  function collectFields() {
    return Array.from(fields.querySelectorAll('input[data-label]')).map(function(input) {
      return {
        label: input.dataset.label,
        value: input.value.trim()
      };
    });
  }

  function generate() {
    if (!selectedRuleId || !noteType.value) return;

    generateBtn.disabled = true;
    setStatus('Generating...');
    resultCard.style.display = 'none';

    const payload = {
      ruleId: selectedRuleId,
      noteType: noteType.value,
      fields: collectFields()
    };

    google.script.run
      .withSuccessHandler(function(result) {
        comment.value = (result && result.comment) ? result.comment : '';
        resultCard.style.display = 'block';
        generateBtn.disabled = false;
        setStatus('');
        comment.focus();
      })
      .withFailureHandler(function(err) {
        generateBtn.disabled = false;
        showError(err);
      })
      .generateSentri7Comment(payload);
  }

  function clearAll() {
    selectedRuleId = '';
    currentForm = null;
    ruleSearch.value = '';
    selectedRule.textContent = '';
    suggestions.style.display = 'none';
    noteType.innerHTML = '<option value="">Select note first</option>';
    noteType.disabled = true;
    fields.innerHTML = '';
    fieldsCard.style.display = 'none';
    resultCard.style.display = 'none';
    comment.value = '';
    setStatus('');
    ruleSearch.focus();
  }

  function setStatus(msg, isError) {
    status.textContent = msg || '';
    status.className = isError ? 'status error' : 'status';
  }

  function showError(err) {
    const msg = err && err.message ? err.message : String(err || 'Unknown error');
    setStatus(msg, true);
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');
  }

  ruleSearch.addEventListener('input', function() {
    if (selectedRuleId) {
      const selected = catalog.find(function(r){ return r.id === selectedRuleId; });
      if (!selected || ruleSearch.value !== selected.title) {
        selectedRuleId = '';
        selectedRule.textContent = '';
        noteType.disabled = true;
        fieldsCard.style.display = 'none';
        resultCard.style.display = 'none';
      }
    }
    showSuggestions();
  });

  ruleSearch.addEventListener('focus', showSuggestions);

  ruleSearch.addEventListener('keydown', function(e) {
    const items = Array.from(suggestions.querySelectorAll('.suggestion'));
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0) {
        e.preventDefault();
        chooseRule(items[activeIndex].dataset.ruleId);
      } else if (items[0]) {
        e.preventDefault();
        chooseRule(items[0].dataset.ruleId);
      }
      return;
    } else if (e.key === 'Escape') {
      suggestions.style.display = 'none';
      return;
    } else {
      return;
    }

    items.forEach(function(x,i) {
      x.classList.toggle('active', i === activeIndex);
    });
    if (items[activeIndex]) items[activeIndex].scrollIntoView({block:'nearest'});
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.control')) {
      suggestions.style.display = 'none';
    }
  });

  noteType.addEventListener('change', function() {
    if (selectedRuleId && noteType.value) loadForm(selectedRuleId, noteType.value);
  });

  generateBtn.addEventListener('click', generate);
  clearBtn.addEventListener('click', clearAll);

  copyBtn.addEventListener('click', async function() {
    try {
      await navigator.clipboard.writeText(comment.value || '');
      copyBtn.textContent = 'Copied';
      setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 900);
    } catch(e) {
      comment.focus();
      comment.select();
      document.execCommand('copy');
      copyBtn.textContent = 'Copied';
      setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 900);
    }
  });

  init();
</script>
</body>
</html>
