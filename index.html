<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentri7 Note Generator</title>
  <style>
    :root{
      --bg:#f4f6f8;--card:#fff;--line:#d9dee5;--line2:#e9edf1;
      --text:#17202a;--muted:#68727d;--accent:#2f5f9f;--accent2:#244d82;
      --danger:#b42318;--shadow:0 1px 3px rgba(16,24,40,.08)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:13px}
    .wrap{width:min(980px,calc(100% - 20px));margin:12px auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:10px;margin-bottom:9px}
    .top-grid{display:grid;grid-template-columns:minmax(260px,1.5fr) minmax(180px,.7fr);gap:8px;align-items:end}
    .control{position:relative}
    label{display:block;font-size:10.5px;font-weight:700;color:#4c5662;margin:0 0 3px 1px;line-height:1.2}
    input,select,textarea,button{font:inherit}
    input[type="text"],input[type="password"],select{
      width:100%;height:32px;border:1px solid #cfd5dc;border-radius:6px;background:#fff;
      padding:5px 8px;color:var(--text);outline:none
    }
    input:focus,select:focus,textarea:focus{border-color:#7da3d3;box-shadow:0 0 0 2px rgba(47,95,159,.10)}
    .suggestions{position:absolute;left:0;right:0;top:53px;background:#fff;border:1px solid #cfd5dc;border-radius:7px;
      box-shadow:0 8px 24px rgba(16,24,40,.12);max-height:320px;overflow:auto;z-index:50;display:none}
    .suggestion{padding:7px 9px;border-bottom:1px solid var(--line2);cursor:pointer;line-height:1.25}
    .suggestion:last-child{border-bottom:0}.suggestion:hover,.suggestion.active{background:#f0f5fb}
    .s-title{font-weight:700;font-size:12px}.s-section{font-size:10.5px;color:var(--muted);margin-top:2px}
    .selected{margin-top:6px;font-size:11px;color:#44505c;min-height:14px}.selected strong{color:#1f2d3d}
    #fieldsCard{display:none}
    .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:6px 7px}
    .field{min-width:0}.field label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
    .field input{height:30px;padding:4px 7px;font-size:12px}
    .action-row{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
    button{height:31px;border-radius:6px;border:1px solid transparent;padding:0 12px;cursor:pointer;font-weight:700;font-size:12px}
    .primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}
    .secondary{background:#fff;border-color:#cfd5dc;color:#39424e}.secondary:hover{background:#f8fafc}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{font-size:11px;color:var(--muted);min-height:14px;margin-left:2px}.status.error{color:var(--danger)}
    #resultCard{display:none}.result-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:5px}
    #comment{width:100%;min-height:112px;resize:vertical;border:1px solid #cfd5dc;border-radius:7px;padding:9px;
      font-size:13px;line-height:1.42;color:#17202a;background:#fff;outline:none}
    .empty-note{font-size:11px;color:var(--muted);padding:2px 0 0 1px}
    .key-btn{position:fixed;right:10px;bottom:10px;height:29px;background:rgba(255,255,255,.94);border:1px solid #cfd5dc;
      color:#56616d;box-shadow:0 2px 8px rgba(16,24,40,.08);z-index:80}
    .overlay{position:fixed;inset:0;background:rgba(22,29,37,.34);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
    .overlay.show{display:flex}
    .key-card{width:min(430px,100%);background:#fff;border-radius:10px;border:1px solid #d9dee5;box-shadow:0 18px 50px rgba(16,24,40,.18);padding:14px}
    .key-title{font-size:16px;font-weight:700;margin-bottom:5px}
    .key-help{font-size:11px;line-height:1.45;color:var(--muted);margin-bottom:10px}
    .key-card input{height:35px}
    .key-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
    .key-error{font-size:11px;color:var(--danger);min-height:14px;margin-top:6px}
    @media(max-width:650px){.top-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}}
    @media(max-width:430px){.fields{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="top-grid">
      <div class="control">
        <label for="ruleSearch">Medication or Sentri7 note</label>
        <input id="ruleSearch" type="text" autocomplete="off" placeholder="e.g., cefepime, heparin, vancomycin, IV to PO">
        <div id="suggestions" class="suggestions"></div>
      </div>
      <div class="control">
        <label for="noteType">Type</label>
        <select id="noteType" disabled><option value="">Select note first</option></select>
      </div>
    </div>
    <div id="selectedRule" class="selected"></div>
  </div>

  <div id="fieldsCard" class="card">
    <div id="fields" class="fields"></div>
    <div id="noFields" class="empty-note" style="display:none"></div>
    <div class="action-row">
      <button id="generateBtn" class="primary" disabled>Generate Comment</button>
      <button id="clearBtn" class="secondary" type="button">Clear</button>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div id="resultCard" class="card">
    <div class="result-top"><button id="copyBtn" class="secondary" type="button">Copy</button></div>
    <textarea id="comment" spellcheck="true"></textarea>
  </div>
</div>

<button id="keyBtn" class="key-btn" type="button">API Key</button>

<div id="keyOverlay" class="overlay">
  <div class="key-card">
    <div class="key-title">Gemini API Key</div>
    <div class="key-help">Enter your Gemini API key once. It is stored only in this browser and is not saved to GitHub. Patient note data is not stored by this page.</div>
    <input id="apiKeyInput" type="password" autocomplete="off" placeholder="Paste Gemini API key">
    <div class="key-actions">
      <button id="saveKeyBtn" class="primary" type="button">Save & Continue</button>
      <button id="cancelKeyBtn" class="secondary" type="button">Cancel</button>
      <button id="forgetKeyBtn" class="secondary" type="button">Forget saved key</button>
    </div>
    <div id="keyError" class="key-error"></div>
  </div>
</div>

<script>
  const RULES_URL = './data/sentri7-rules.json';
  const API_KEY_STORAGE = 'sentri7_gemini_api_key';
  const PRIMARY_MODEL = 'gemini-3.5-flash-lite';
  const FALLBACK_MODELS = ['gemini-3.8-flash','gemini-3.6-flash'];

  let rules = [];
  let catalog = [];
  let selectedRuleId = '';
  let currentForm = null;

  const ruleSearch = document.getElementById('ruleSearch');
  const suggestions = document.getElementById('suggestions');
  const noteType = document.getElementById('noteType');
  const selectedRule = document.getElementById('selectedRule');
  const fieldsCard = document.getElementById('fieldsCard');
  const fields = document.getElementById('fields');
  const noFields = document.getElementById('noFields');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const resultCard = document.getElementById('resultCard');
  const comment = document.getElementById('comment');
  const copyBtn = document.getElementById('copyBtn');
  const keyOverlay = document.getElementById('keyOverlay');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const keyError = document.getElementById('keyError');

  async function init(){
    setStatus('Loading Sentri7 rules...');
    try{
      const res = await fetch(RULES_URL,{cache:'no-store'});
      if(!res.ok) throw new Error('Could not load Sentri7 rules.');
      rules = await res.json();
      if(!Array.isArray(rules) || !rules.length) throw new Error('Sentri7 rule library is empty.');
      catalog = rules.map(rule => ({
        id: rule.id,
        title: rule.title,
        section: rule.section,
        searchText: rule.searchText || buildSearchText(rule),
        types: Object.keys(rule.paths || {}).filter(k => rule.paths[k] && rule.paths[k].available)
      }));
      setStatus('');
      if(!getApiKey()) showKeyModal(true);
    }catch(err){ showError(err); }
  }

  function buildSearchText(rule){
    const parts=[rule.title,rule.section,rule.purpose,rule.action];
    Object.keys(rule.paths||{}).forEach(k=>{
      const p=rule.paths[k]||{};
      parts.push(k,p.when,p.what);
      (p.examples||[]).forEach(ex=>parts.push(ex && ex.text));
    });
    return parts.filter(Boolean).join(' ').toLowerCase();
  }

  function normalize(s){ return String(s||'').toLowerCase().trim(); }

  function scoreRule(rule,query){
    const q=normalize(query); if(!q) return -1;
    const title=normalize(rule.title), section=normalize(rule.section), all=normalize(rule.searchText);
    const tokens=q.split(/\s+/).filter(Boolean);
    let score=0;
    if(title===q) score+=300;
    if(title.startsWith(q)) score+=170;
    if(title.includes(q)) score+=120;
    if(section.includes(q)) score+=35;
    if(all.includes(q)) score+=50;
    tokens.forEach(t=>{ if(title.includes(t)) score+=35; if(all.includes(t)) score+=9; });
    return score;
  }

  function findMatches(query){
    return catalog.map(r=>({rule:r,score:scoreRule(r,query)}))
      .filter(x=>x.score>0)
      .sort((a,b)=>b.score-a.score || a.rule.title.localeCompare(b.rule.title))
      .slice(0,14).map(x=>x.rule);
  }

  function showSuggestions(){
    const q=ruleSearch.value.trim(), matches=findMatches(q);
    suggestions.innerHTML='';
    if(!q || !matches.length){ suggestions.style.display='none'; return; }
    matches.forEach(rule=>{
      const div=document.createElement('div');
      div.className='suggestion';
      div.innerHTML='<div class="s-title">'+escapeHtml(rule.title)+'</div><div class="s-section">'+escapeHtml(rule.section)+'</div>';
      div.addEventListener('mousedown',e=>{e.preventDefault();chooseRule(rule.id);});
      suggestions.appendChild(div);
    });
    suggestions.style.display='block';
  }

  function chooseRule(ruleId){
    const meta=catalog.find(r=>r.id===ruleId), rule=rules.find(r=>r.id===ruleId);
    if(!meta || !rule) return;
    selectedRuleId=ruleId;
    ruleSearch.value=meta.title;
    suggestions.style.display='none';
    selectedRule.innerHTML='<strong>'+escapeHtml(meta.title)+'</strong> · '+escapeHtml(meta.section);
    noteType.innerHTML='';
    (meta.types||[]).forEach(type=>{
      const opt=document.createElement('option'); opt.value=type; opt.textContent=type; noteType.appendChild(opt);
    });
    noteType.disabled=!(meta.types&&meta.types.length);
    loadForm(rule, meta.types&&meta.types.length ? meta.types[0] : '');
  }

  function loadForm(rule,type){
    const availableTypes=Object.keys(rule.paths||{}).filter(k=>rule.paths[k]&&rule.paths[k].available);
    const selected=type&&rule.paths[type]&&rule.paths[type].available ? type : (availableTypes[0]||'');
    currentForm={rule,selectedType:selected,availableTypes};
    renderForm();
  }

  function renderForm(){
    const form=currentForm, rule=form.rule, type=form.selectedType;
    fields.innerHTML=''; noFields.style.display='none'; fieldsCard.style.display='block';
    resultCard.style.display='none'; comment.value='';
    noteType.innerHTML='';
    form.availableTypes.forEach(t=>{
      const opt=document.createElement('option'); opt.value=t; opt.textContent=t; opt.selected=t===type; noteType.appendChild(opt);
    });
    noteType.disabled=!form.availableTypes.length;
    if(!type){
      noFields.textContent='No documentation template is defined for this rule.';
      noFields.style.display='block'; generateBtn.disabled=true; return;
    }
    const req=(rule.paths[type].requirements||[]);
    if(!req.length){
      noFields.textContent='No required fields are listed for this pathway.';
      noFields.style.display='block';
    }else{
      req.forEach((labelText,i)=>{
        const wrap=document.createElement('div'); wrap.className='field';
        const label=document.createElement('label'); label.htmlFor='field_'+i; label.textContent=labelText; label.title=labelText;
        const input=document.createElement('input'); input.type='text'; input.id='field_'+i; input.dataset.label=labelText; input.placeholder='[]'; input.autocomplete='off';
        wrap.appendChild(label); wrap.appendChild(input); fields.appendChild(wrap);
      });
    }
    generateBtn.disabled=false;
  }

  function collectFields(){
    return Array.from(fields.querySelectorAll('input[data-label]')).map(input=>({
      label:input.dataset.label,value:input.value.trim() || '[]'
    }));
  }

  async function generate(){
    if(!selectedRuleId || !noteType.value) return;
    if(!getApiKey()){ showKeyModal(true); return; }
    generateBtn.disabled=true; resultCard.style.display='none'; setStatus('Generating...');
    try{
      const rule=rules.find(r=>r.id===selectedRuleId);
      const path=rule && rule.paths ? rule.paths[noteType.value] : null;
      if(!rule || !path || !path.available) throw new Error('Selected Sentri7 template is unavailable.');
      const prompt=buildPrompt(rule,noteType.value,path,collectFields());
      let output=await callGemini(prompt);
      output=output.replace(/^\`\`\`(?:text)?\s*/i,'').replace(/\s*\`\`\`$/i,'').trim();
      if(!output) throw new Error('Gemini returned an empty comment.');
      comment.value=output; resultCard.style.display='block'; setStatus('');
    }catch(err){
      showError(err);
      if(/API key|authentication|permission|403|401/i.test(String(err&&err.message||err))) showKeyModal(false);
    }finally{ generateBtn.disabled=false; }
  }

  function buildPrompt(rule,type,path,userFields){
    const examples=(path.examples||[]).filter(x=>x&&x.text&&!isNA(x.text))
      .map(x=>(x.label||'Example')+':\n'+x.text).join('\n\n');
    const fieldBlock=userFields.map(x=>'- '+x.label+': '+(x.value||'[]')).join('\n');
    return [
      'You are formatting a Sentri7 pharmacist documentation comment.',
      '',
      'MANDATORY RULES:',
      '1. The Sentri7 guideline below is the ONLY source of truth.',
      '2. The EXCEL EXAMPLE is the primary template for sentence order, phrasing style, abbreviations, and formatting.',
      '3. The example contains sample-patient facts. NEVER copy a medication, dose, lab value, diagnosis, organism, provider, outcome, date, or other patient fact from the example unless that same fact appears in USER-ENTERED DATA.',
      '4. Use every required field listed in USER-ENTERED DATA.',
      '5. If a required field has the value [], keep [] visibly in the final comment where that information naturally belongs.',
      '6. Never invent or infer missing clinical facts and never fill [] using general medical knowledge.',
      '7. Correct spelling, grammar, capitalization, punctuation, spacing, and formatting in user-entered text.',
      '8. Correct an obvious medication-name typo only when the intended medication is unambiguous from the selected rule and user entry.',
      '9. Preserve all patient-specific numbers, doses, units, routes, frequencies, lab values, organisms, dates, and provider names exactly in meaning. Normalize spacing/capitalization only.',
      '10. If the Excel example is multiline or uses headings, preserve that general structure.',
      '11. Do not add Assessment, Plan, warnings, explanations, or clinical advice unless the Excel example uses them.',
      '12. Output ONLY the final Sentri7 comment. No quotation marks, no preface, no explanation.',
      '',
      'SELECTED SENTRI7 RULE:',rule.title,
      '',
      'CLINICAL AREA:',rule.section,
      '',
      'DOCUMENTATION TYPE:',type,
      '',
      'RULE PURPOSE:',rule.purpose||'Not provided in Excel',
      '',
      'RULE ACTION:',rule.action||'Not provided in Excel',
      '',
      'WHEN THIS PATH IS USED:',path.when||'Not provided in Excel',
      '',
      'REQUIRED DOCUMENTATION FROM EXCEL ("What"):',path.what||'Not provided in Excel',
      '',
      'EXCEL EXAMPLE TEMPLATE(S):',examples||'No example provided in Excel',
      '',
      'USER-ENTERED DATA:',fieldBlock||'- No required fields are defined in Excel for this pathway.',
      '',
      'Produce the final Sentri7 comment now.'
    ].join('\n');
  }

  async function callGemini(prompt){
    const key=getApiKey();
    if(!key) throw new Error('Gemini API key is not configured.');
    const models=[PRIMARY_MODEL,...FALLBACK_MODELS].filter((v,i,a)=>a.indexOf(v)===i);
    const body={contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{temperature:0.1,maxOutputTokens:2048}};
    let lastError='';
    for(const model of models){
      const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
      for(let attempt=0;attempt<4;attempt++){
        let res;
        try{
          res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
        }catch(e){
          lastError='Network error: '+e.message;
          if(attempt<3){ await sleep(Math.pow(2,attempt)*1000); continue; }
          break;
        }
        const text=await res.text();
        if(res.ok){
          let data; try{data=JSON.parse(text);}catch(e){throw new Error('Gemini returned an invalid response.');}
          const parts=((((data.candidates||[])[0]||{}).content||{}).parts||[]);
          const output=parts.map(p=>p.text||'').join('').trim();
          if(output) return output;
          lastError='Gemini returned no usable text.';
          break;
        }
        lastError='Gemini API '+res.status+': '+text.slice(0,500);
        if(res.status===401 || res.status===403) throw new Error('Gemini API authentication failed. Check the saved API key.');
        const retryable=res.status===408 || res.status===429 || (res.status>=500&&res.status<=599);
        if(!retryable) throw new Error(lastError);
        if(attempt<3) await sleep(Math.pow(2,attempt)*1000 + Math.floor(Math.random()*400));
      }
    }
    throw new Error('Gemini is temporarily unavailable. '+lastError);
  }

  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
  function isNA(v){const x=String(v||'').trim().toUpperCase();return !x||x==='NA'||x==='N/A';}
  function getApiKey(){return localStorage.getItem(API_KEY_STORAGE)||'';}

  function showKeyModal(required){
    keyError.textContent='';
    apiKeyInput.value='';
    document.getElementById('cancelKeyBtn').style.display=required?'none':'inline-block';
    keyOverlay.classList.add('show');
    setTimeout(()=>apiKeyInput.focus(),50);
  }

  function hideKeyModal(){keyOverlay.classList.remove('show');}

  document.getElementById('saveKeyBtn').addEventListener('click',()=>{
    const key=apiKeyInput.value.trim();
    if(!key){keyError.textContent='Paste your Gemini API key.';return;}
    localStorage.setItem(API_KEY_STORAGE,key); hideKeyModal(); setStatus('');
  });
  document.getElementById('cancelKeyBtn').addEventListener('click',hideKeyModal);
  document.getElementById('forgetKeyBtn').addEventListener('click',()=>{
    localStorage.removeItem(API_KEY_STORAGE); apiKeyInput.value=''; keyError.textContent='Saved key removed.';
  });
  document.getElementById('keyBtn').addEventListener('click',()=>showKeyModal(false));

  ruleSearch.addEventListener('input',()=>{
    if(selectedRuleId && ruleSearch.value.trim()!==(catalog.find(r=>r.id===selectedRuleId)||{}).title){
      selectedRuleId=''; selectedRule.innerHTML=''; noteType.innerHTML='<option value="">Select note first</option>'; noteType.disabled=true;
      fieldsCard.style.display='none'; resultCard.style.display='none';
    }
    showSuggestions();
  });
  ruleSearch.addEventListener('focus',showSuggestions);
  ruleSearch.addEventListener('blur',()=>setTimeout(()=>suggestions.style.display='none',120));
  noteType.addEventListener('change',()=>{
    const rule=rules.find(r=>r.id===selectedRuleId); if(rule) loadForm(rule,noteType.value);
  });
  generateBtn.addEventListener('click',generate);
  clearBtn.addEventListener('click',()=>{
    ruleSearch.value='';selectedRuleId='';selectedRule.innerHTML='';noteType.innerHTML='<option value="">Select note first</option>';
    noteType.disabled=true;fieldsCard.style.display='none';resultCard.style.display='none';comment.value='';setStatus('');ruleSearch.focus();
  });
  copyBtn.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(comment.value);copyBtn.textContent='Copied';setTimeout(()=>copyBtn.textContent='Copy',1000);}
    catch(e){comment.select();document.execCommand('copy');}
  });

  function setStatus(msg,isError=false){statusEl.textContent=msg||'';statusEl.className='status'+(isError?' error':'');}
  function showError(err){setStatus(err&&err.message?err.message:String(err),true);}
  function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

  init();
</script>
</body>
</html>
