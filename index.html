<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentri7 Note Generator</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f6f8}
    #app{width:100%;height:100%;border:0;display:block;background:#fff}
    #fallback{
      display:none;
      font-family:Arial,Helvetica,sans-serif;
      padding:24px;
      color:#17202a;
    }
    #fallback a{color:#2f5f9f;font-weight:700}
  </style>
</head>
<body>
  <iframe
    id="app"
    title="Sentri7 Note Generator"
    src="https://script.google.com/macros/s/AKfycbwchGkg-T8r_x5GQAN-ISfBd3yPFVccv_Q34Hw1P1xjQYq9e7vmEtHOXz8KdsrwBWHK/exec"
    allow="clipboard-write">
  </iframe>

  <div id="fallback">
    <p>The app could not be embedded.</p>
    <p>
      <a href="https://script.google.com/macros/s/AKfycbwchGkg-T8r_x5GQAN-ISfBd3yPFVccv_Q34Hw1P1xjQYq9e7vmEtHOXz8KdsrwBWHK/exec">
        Open Sentri7 Note Generator
      </a>
    </p>
  </div>

  <script>
    const frame = document.getElementById('app');
    let loaded = false;

    frame.addEventListener('load', function(){
      loaded = true;
    });

    setTimeout(function(){
      if(!loaded){
        frame.style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }
    }, 12000);
  </script>
</body>
</html>
